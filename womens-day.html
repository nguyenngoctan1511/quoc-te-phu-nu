<!DOCTYPE html>
<html lang="vi">

<head>
	<meta charset="UTF-8">
	<meta name="viewport"
		content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="mobile-web-app-capable" content="yes">
	<title>Happy Women's Day 🌸</title>
	<link
		href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500&display=swap"
		rel="stylesheet">
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			-webkit-tap-highlight-color: transparent;
		}

		html {
			height: -webkit-fill-available;
		}

		body {
			width: 100%;
			min-height: 100vh;
			min-height: -webkit-fill-available;
			min-height: 100dvh;
			overflow: hidden;
			background: #000;
			font-family: 'Quicksand', sans-serif;
			touch-action: none;
			padding-top: env(safe-area-inset-top);
			padding-bottom: env(safe-area-inset-bottom);
			padding-left: env(safe-area-inset-left);
			padding-right: env(safe-area-inset-right);
		}

		#galaxyCv {
			display: block;
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			z-index: -2;
		}

		/* Sits between the galaxy and c2d — dims the backdrop behind the fireworks
		   without covering the fireworks themselves (those are drawn opaque on c2d,
		   on top of this layer). */
		#dimOverlay {
			position: fixed;
			inset: 0;
			z-index: -1;
			background: #000;
			opacity: 0;
			pointer-events: none;
			transition: opacity .8s ease;
		}

		#c2d {
			display: block;
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			z-index: 0;
		}

		#c3d {
			display: none;
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			z-index: 1;
			pointer-events: none;
		}

		#c3d.active {
			display: block;
			pointer-events: all;
		}

		#dimOverlay.show {
			opacity: .4;
		}

		.screen {
			position: fixed;
			inset: 0;
			z-index: 20;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			opacity: 0;
			pointer-events: none;
			transition: opacity 1s ease;
		}

		.screen.active {
			opacity: 1;
			pointer-events: all;
		}

		#phaseLoading {
			background: transparent
		}

		.loadText {
			color: #ffffff;
			font-family: 'Dancing Script', cursive;
			letter-spacing: 2px;
			font-size: 34px;
			text-shadow: 0 0 16px rgba(255, 100, 180, 1), 0 0 40px rgba(255, 50, 150, 0.8);
		}

		.loadBarWrap {
			width: 200px;
			height: 3px;
			background: rgba(255, 130, 190, .2);
			border-radius: 10px;
			margin-top: 24px;
			overflow: hidden;
		}

		.loadBar {
			height: 100%;
			width: 0%;
			background: linear-gradient(90deg, #ff6eb4, #ff1493);
			border-radius: 10px;
			box-shadow: 0 0 8px rgba(255, 100, 180, .8);
			transition: width .1s linear;
		}

		#phaseHold {
			justify-content: flex-end;
			padding-bottom: calc(90px + env(safe-area-inset-bottom));
		}

		#holdWrap {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 28px;
		}

		#holdHint {
			color: #fff;
			font-size: 15px;
			font-weight: 700;
			letter-spacing: 3px;
			text-transform: uppercase;
			text-shadow: 0 0 10px rgba(255, 110, 180, 1), 0 0 20px rgba(255, 60, 150, .8), 0 1px 3px rgba(0, 0, 0, .5);
			animation: pulse 2s ease-in-out infinite;
		}

		@keyframes pulse {

			0%,
			100% {
				opacity: .8
			}

			50% {
				opacity: 1
			}
		}

		#holdBtn {
			position: relative;
			width: 80px;
			height: 80px;
			cursor: pointer;
			user-select: none;
			-webkit-user-select: none;
		}

		.ring {
			position: absolute;
			inset: 0;
			border-radius: 50%;
			border: 1.5px solid rgba(255, 130, 190, .35);
			animation: ringPulse 2.5s ease-in-out infinite;
		}

		.ring:nth-child(2) {
			animation-delay: .6s;
			transform: scale(1.28);
		}

		.ring:nth-child(3) {
			animation-delay: 1.2s;
			transform: scale(1.58);
		}

		@keyframes ringPulse {

			0%,
			100% {
				opacity: .2
			}

			50% {
				opacity: .75
			}
		}

		.dot {
			position: absolute;
			inset: 8px;
			border-radius: 50%;
			background: radial-gradient(circle at 40% 35%, #ff9ec4, #d9006e 60%, #8b0038);
			box-shadow: 0 0 18px 6px rgba(255, 80, 160, .55), 0 0 40px 12px rgba(200, 0, 120, .25);
			transition: transform .15s, box-shadow .15s;
		}

		#holdBtn.pressing .dot {
			transform: scale(.88);
			box-shadow: 0 0 28px 12px rgba(255, 80, 160, .85), 0 0 60px 20px rgba(200, 0, 120, .45);
		}

		#progressRing {
			position: absolute;
			inset: -4px;
			width: calc(100% + 8px);
			height: calc(100% + 8px);
			transform: rotate(-90deg);
			pointer-events: none;
		}

		#progressCircle {
			fill: none;
			stroke: url(#grad);
			stroke-width: 2.5;
			stroke-linecap: round;
			stroke-dasharray: 263;
			stroke-dashoffset: 263;
			transition: stroke-dashoffset .05s linear;
			filter: drop-shadow(0 0 4px rgba(255, 100, 180, 1));
		}

		#phaseText {
			background: transparent;
			pointer-events: none;
		}

		#btnContinue {
			position: fixed;
			bottom: calc(28px + env(safe-area-inset-bottom));
			left: 50%;
			transform: translateX(-50%);
			padding: 12px 30px;
			background: linear-gradient(135deg, rgba(255, 110, 180, .4), rgba(130, 40, 170, .4));
			backdrop-filter: blur(8px);
			-webkit-backdrop-filter: blur(8px);
			border: 1.5px solid rgba(255, 190, 225, .65);
			border-radius: 999px;
			color: #fff;
			font-family: 'Quicksand', sans-serif;
			font-size: 15px;
			font-weight: 600;
			letter-spacing: 1.5px;
			cursor: pointer;
			opacity: 0;
			pointer-events: none;
			transition: opacity .7s ease, transform .15s, box-shadow .2s;
			z-index: 30;
			text-shadow: 0 0 10px rgba(255, 150, 200, .9);
			box-shadow: 0 0 20px rgba(255, 100, 180, .5), inset 0 0 14px rgba(255, 255, 255, .1);
			white-space: nowrap;
		}

		#btnContinue.show {
			opacity: 1;
			pointer-events: all;
			animation: btnContinuePulse 2.2s ease-in-out infinite;
		}

		@keyframes btnContinuePulse {

			0%,
			100% {
				box-shadow: 0 0 20px rgba(255, 100, 180, .5), inset 0 0 14px rgba(255, 255, 255, .1);
			}

			50% {
				box-shadow: 0 0 30px rgba(255, 130, 195, .8), inset 0 0 18px rgba(255, 255, 255, .16);
			}
		}

		#btnContinue:hover {
			transform: translateX(-50%) scale(1.05);
			border-color: rgba(255, 220, 235, .9);
		}

		#btnContinue:active {
			transform: translateX(-50%) scale(.95);
		}

		#letterIcon {
			position: fixed;
			right: 24px;
			bottom: calc(28px + env(safe-area-inset-bottom));
			z-index: 40;
			width: 60px;
			height: 60px;
			border-radius: 50%;
			background: linear-gradient(135deg, #ff6eb4, #cc0066);
			display: flex;
			align-items: center;
			justify-content: center;
			cursor: pointer;
			font-size: 28px;
			box-shadow: 0 0 20px rgba(255, 80, 160, .7);
			opacity: 0;
			pointer-events: none;
			transition: opacity .8s ease;
			animation: iconPulse 2s ease-in-out infinite;
		}

		@keyframes iconPulse {

			0%,
			100% {
				box-shadow: 0 0 20px rgba(255, 80, 160, .5)
			}

			50% {
				box-shadow: 0 0 36px rgba(255, 80, 160, 1)
			}
		}

		#letterIcon.show {
			opacity: 1;
			pointer-events: all;
		}

		#letterModal {
			position: fixed;
			inset: 0;
			z-index: 50;
			display: flex;
			align-items: center;
			justify-content: center;
			background: rgba(0, 0, 0, .6);
			backdrop-filter: blur(6px);
			-webkit-backdrop-filter: blur(6px);
			opacity: 0;
			pointer-events: none;
			transition: opacity .6s ease;
			padding: 20px;
			padding-bottom: calc(20px + env(safe-area-inset-bottom));
		}

		#letterModal.show {
			opacity: 1;
			pointer-events: all;
		}

		.letterPaper {
			background: linear-gradient(135deg, #fff9fb, #ffe8f3);
			border-radius: 20px;
			padding: 40px 36px;
			max-width: min(500px, 90vw);
			width: 100%;
			box-shadow: 0 20px 80px rgba(255, 80, 160, .35), 0 0 0 1px rgba(255, 150, 200, .3);
			position: relative;
		}

		.letterClose {
			position: absolute;
			top: 14px;
			right: 18px;
			font-size: 22px;
			cursor: pointer;
			color: #cc0066;
			background: none;
			border: none;
		}

		.letterTitle {
			font-family: 'Dancing Script', cursive;
			font-size: 28px;
			color: #8b0055;
			text-align: center;
			margin-bottom: 20px;
		}

		#letterContent {
			font-size: 15px;
			line-height: 1.9;
			color: #5a0030;
			min-height: 60px;
		}

		.cursor {
			display: inline-block;
			width: 2px;
			height: 1em;
			background: #cc0066;
			animation: blink .7s step-end infinite;
			vertical-align: text-bottom;
			margin-left: 1px;
		}

		@keyframes blink {

			0%,
			100% {
				opacity: 1
			}

			50% {
				opacity: 0
			}
		}
	</style>
</head>

<body>
	<svg width="0" height="0" style="position:absolute">
		<defs>
			<linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
				<stop offset="0%" stop-color="#ff6eb4" />
				<stop offset="100%" stop-color="#ff1493" />
			</linearGradient>
		</defs>
	</svg>

	<canvas id="galaxyCv"></canvas>
	<div id="dimOverlay"></div>
	<canvas id="c2d"></canvas>
	<canvas id="c3d"></canvas>
	<canvas id="textCanvas" style="display:none"></canvas>

	<div class="screen active" id="phaseLoading">
		<div class="loadText">Đang tải...</div>
		<div class="loadBarWrap">
			<div class="loadBar" id="loadBar"></div>
		</div>
	</div>
	<div class="screen" id="phaseHold">
		<div id="holdWrap">
			<span id="holdHint">Giữ để mở khóa</span>
			<div id="holdBtn">
				<div class="ring"></div>
				<div class="ring"></div>
				<div class="ring"></div>
				<div class="dot"></div>
				<svg id="progressRing" viewBox="0 0 88 88">
					<circle id="progressCircle" cx="44" cy="44" r="41.8" />
				</svg>
			</div>
		</div>
	</div>
	<div class="screen" id="phaseText"></div>
	<button id="btnContinue">Click xem tiếp nha</button>
	<div id="letterIcon">💌</div>
	<div id="letterModal">
		<div class="letterPaper">
			<button class="letterClose" id="letterClose">✕</button>
			<div class="letterTitle">💌 Lời Nhắn Yêu Thương</div>
			<div id="letterContent"><span class="cursor"></span></div>
		</div>
	</div>

	<script>
		var MP3_URL = './noi_nay_co_anh_3.mp3';
		var PHOTOS = [
			'./20-10/482986080_1836041327217702_838148000994299184_n.jpg',
			'./20-10/484070375_1836041310551037_1211495794599239922_n.jpg',
			'./20-10/484071311_1836041387217696_7756690517306256304_n.jpg',
			'./20-10/484449639_1836041380551030_1999920715385558374_n.jpg',
			'./20-10/608154018_2074595156695650_5132343781880219789_n.jpg',
			'./20-10/608520648_2074595150028984_7215256171616238864_n.jpg',
			'./20-10/611478167_2074595123362320_4458714859675407912_n.jpg',
			'./20-10/729375290_2223000325188465_7998546068300335513_n.jpg',
		];
		var LETTER_TEXT = 'Chúc em một ngày 20/10 thật vui vẻ và ý nghĩa nhé! 🌸💐✨\n\nCảm ơn em vì đã luôn cố gắng, luôn nỗ lực mỗi ngày và vẫn luôn giữ được sự đáng yêu, đặc biệt của riêng mình. ❤️\n\nAnh mong em sẽ luôn xinh đẹp, rạng rỡ, gặp thật nhiều may mắn và thuận lợi trên con đường phía trước. Dù có những ngày mệt mỏi hay không được như ý, cũng mong em luôn giữ được nụ cười và sự vui vẻ của mình nhé. 🎀🍀\n\nChúc em luôn mạnh khỏe, bình an và hạnh phúc. Mong rằng những điều tốt đẹp nhất sẽ luôn đến với em, không chỉ hôm nay mà cả những ngày về sau nữa. ❤️\n\n— From: anh T giấu tên! 🌷';

		var c2d = document.getElementById('c2d');
		var ctx = c2d.getContext('2d');
		var galaxyCv = document.getElementById('galaxyCv');
		var gctx = galaxyCv.getContext('2d');
		var W, H, CX, CY;

		function resize() {
			var dpr = Math.min(window.devicePixelRatio || 1, 2);
			W = (window.visualViewport ? window.visualViewport.width : window.innerWidth);
			H = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
			CX = W / 2; CY = H / 2;
			c2d.width = W * dpr; c2d.height = H * dpr;
			c2d.style.width = W + 'px'; c2d.style.height = H + 'px';
			ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
			galaxyCv.width = W * dpr; galaxyCv.height = H * dpr;
			galaxyCv.style.width = W + 'px'; galaxyCv.style.height = H + 'px';
			gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
		}
		resize();

		function onResize() {
			resize();
			if (threeRenderer) {
				threeRenderer.setSize(W, H);
				threeCamera.aspect = W / H;
				threeCamera.updateProjectionMatrix();
			}
			drawGalaxyBackground();
		}
		window.addEventListener('resize', onResize);
		if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);

		document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

		var PAL = ['rgba(255,255,255,', 'rgba(190,210,255,', 'rgba(255,235,195,', 'rgba(210,180,255,', 'rgba(255,200,225,', 'rgba(170,225,255,'];
		var BG_COUNT = 3000, BG_ABINS = 12;
		var bgParts = [];
		for (var i = 0; i < BG_COUNT; i++) bgParts.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.3 + .3, vx: (Math.random() - .5) * .32, vy: (Math.random() - .5) * .32, ba: Math.random() * .5 + .12, colIdx: Math.floor(Math.random() * PAL.length), tw: Math.random() * Math.PI * 2 });
		function updateBg(dt) { for (var p of bgParts) { p.x += p.vx * dt; p.y += p.vy * dt; if (p.x < -2) p.x = W + 2; else if (p.x > W + 2) p.x = -2; if (p.y < -2) p.y = H + 2; else if (p.y > H + 2) p.y = -2; } }
		// Persistent bucket arrays reused every frame (only .length = 0 to clear) — drawing
		// thousands of particles this way costs zero per-frame allocation and at most
		// (colors × alpha steps) fill() calls, so bumping the particle count stays cheap.
		var bgBuckets = [];
		for (var bc = 0; bc < PAL.length; bc++) { var row = []; for (var bb = 0; bb <= BG_ABINS; bb++) row.push([]); bgBuckets.push(row); }
		function drawBg() {
			var t = Date.now() * .0007;
			for (var c = 0; c < bgBuckets.length; c++) for (var b = 0; b < bgBuckets[c].length; b++) bgBuckets[c][b].length = 0;
			for (var i = 0; i < bgParts.length; i++) {
				var p = bgParts[i];
				var a = p.ba * (.5 + .5 * Math.sin(t + p.tw));
				var bin = Math.round(a * BG_ABINS);
				if (bin <= 0) continue;
				bgBuckets[p.colIdx][bin].push(p);
			}
			for (var c2 = 0; c2 < bgBuckets.length; c2++) {
				for (var b2 = 1; b2 <= BG_ABINS; b2++) {
					var items = bgBuckets[c2][b2];
					if (!items.length) continue;
					ctx.fillStyle = PAL[c2] + (b2 / BG_ABINS).toFixed(3) + ')';
					ctx.beginPath();
					for (var j = 0; j < items.length; j++) { var pt = items[j]; ctx.moveTo(pt.x + pt.r, pt.y); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2); }
					ctx.fill();
				}
			}
		}
		var sstars = [];
		setInterval(function () { if (sstars.length < 5) sstars.push({ x: Math.random() * W, y: Math.random() * H * .4, len: Math.random() * 130 + 60, spd: Math.random() * 6 + 4, ang: Math.PI / 6 + (Math.random() - .5) * .3, a: 1, w: Math.random() * 1.2 + .4 }); }, 1400);
		function drawStars(dt) { for (var i = sstars.length - 1; i >= 0; i--) { var s = sstars[i]; s.x += Math.cos(s.ang) * s.spd * dt; s.y += Math.sin(s.ang) * s.spd * dt; s.a -= .018 * dt; if (s.a <= 0) { sstars.splice(i, 1); continue; } var g = ctx.createLinearGradient(s.x, s.y, s.x - Math.cos(s.ang) * s.len, s.y - Math.sin(s.ang) * s.len); g.addColorStop(0, 'rgba(255,255,255,' + s.a + ')'); g.addColorStop(1, 'rgba(180,210,255,0)'); ctx.save(); ctx.strokeStyle = g; ctx.lineWidth = s.w; ctx.shadowBlur = 8; ctx.shadowColor = 'rgba(200,220,255,.5)'; ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - Math.cos(s.ang) * s.len, s.y - Math.sin(s.ang) * s.len); ctx.stroke(); ctx.restore(); } }

		// ====== GALAXY BACKDROP ======
		// Drawn once onto its own canvas sitting behind everything (not redrawn every
		// frame, not touched by the trail-fade below) — a soft diagonal Milky Way band
		// with a bright core and scattered dust, instead of the old flat pink glow.
		function drawGalaxyBackground() {
			gctx.clearRect(0, 0, W, H);
			var bandAngle = -0.5, cx = W * 0.5, cy = H * 0.42, length = Math.max(W, H) * 1.4;
			// More saturated hues + lower alpha: a darker base with punchier, less washed-out
			// color (instead of a bright pale haze that fights with the UI text on top).
			var hues = [[110, 60, 220], [40, 90, 230], [210, 70, 200], [50, 180, 220], [170, 50, 180]];
			for (var i = 0; i < 16; i++) {
				var t = (i / 15 - 0.5) * length;
				var x = cx + Math.cos(bandAngle) * t, y = cy + Math.sin(bandAngle) * t;
				var r = Math.max(W, H) * 0.24 * (0.65 + 0.35 * Math.sin(i * 1.7 + 1));
				var col = hues[i % hues.length];
				var grad = gctx.createRadialGradient(x, y, 0, x, y, r);
				grad.addColorStop(0, 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',0.15)');
				grad.addColorStop(0.5, 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',0.05)');
				grad.addColorStop(1, 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',0)');
				gctx.fillStyle = grad; gctx.fillRect(0, 0, W, H);
			}
			gctx.save();
			gctx.translate(cx, cy); gctx.rotate(bandAngle); gctx.scale(1.8, 1);
			var core = gctx.createRadialGradient(0, 0, 0, 0, 0, Math.max(W, H) * 0.1);
			core.addColorStop(0, 'rgba(255,250,240,.3)'); core.addColorStop(0.5, 'rgba(255,230,210,.09)'); core.addColorStop(1, 'rgba(255,230,210,0)');
			gctx.fillStyle = core; gctx.fillRect(-W, -H, W * 2, H * 2);
			gctx.restore();
			// Dust lane: a chain of soft overlapping dark blobs across the core (round
			// gradients, not a rectangle) so it reads as organic haze like a real photo
			// of a galaxy, not a hard geometric stripe.
			gctx.save();
			gctx.translate(cx, cy); gctx.rotate(bandAngle); gctx.translate(0, Math.max(W, H) * 0.028);
			gctx.globalCompositeOperation = 'destination-out';
			var dustLen = Math.max(W, H) * 0.5, dustSteps = 14;
			for (var i = 0; i < dustSteps; i++) {

			ctx.fillRect(0, 0, W, H);
			ctx.restore();
			updateBg(dt); drawBg(); drawStars(dt);
			// NEW: fireworks + flower
			updateFireworks(dt);
			updateFlowerBouquet(dt);
			checkHold(); updateParticleText(dt); updateAssemble(dt); updateBalloons(dt); updateFlying(dt);
		}
		loop();
	</script>
